name: Knockout Power Ranking

# Publishes a Power Ranking of the teams STILL ALIVE in the 2026 World Cup,
# built from the REAL remaining bracket (read live from ESPN). No team list is
# hard-coded — knockout_ranking.py derives the survivors and their pairings
# from live fixtures and aborts if the count is unexpected.
#
# Scheduled run = FINAL 4 (the 4 semi-finalists), the morning after the
# Quarter-finals. The FINAL 8 (post Round of 16) was published manually, so it
# has no cron; use the manual workflow_dispatch (survivors=8) if it's ever
# needed again. The final itself is covered by the match-prediction Short.
#
# Replaces the old Weekly Power Ranking (weekly_power_ranking.yml, removed).
#
# RETIRED 2026-07-20 — the tournament is over and its scheduled run (Final 4)
# already happened on Jul 13. The cron was `0 6 13 7 *`, and since GitHub cron
# ignores the year it would have fired again every Jul 13, so it has been
# removed. Manual runs still work from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      survivors:
        description: "Surviving teams to rank (4 = Final 4, 8 = Final 8)"
        required: true
        default: "4"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ffmpeg
        run: |
          # GitHub runners ship extra apt repos (Microsoft/azure-cli) whose
          # signature is occasionally broken upstream, which makes a plain
          # `apt-get update` exit 100 and kill the whole job (this cost an
          # Auto Matches run on 2026-07-07). ffmpeg lives in the base Ubuntu
          # repos, so drop those third-party lists first and tolerate a flaky
          # update — the runner image already ships a usable package index.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore credentials from secrets
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_CLIENT_SECRET" > credentials/client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > credentials/token.json

      - name: Determine surviving-team count
        id: pick
        run: |
          # Scheduled runs are the Final 4; a manual dispatch may override.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SURVIVORS="${{ github.event.inputs.survivors }}"
          else
            SURVIVORS="4"
          fi
          echo "survivors=$SURVIVORS" >> "$GITHUB_OUTPUT"
          echo "Publishing knockout Power Ranking for FINAL $SURVIVORS"

      - name: Render and upload Knockout Power Ranking
        run: python main.py knockout_ranking --survivors ${{ steps.pick.outputs.survivors }}
